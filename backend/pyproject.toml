[project]
name = "ugjcs"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.3",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL container (deselected by default)",
]

[tool.coverage.run]
source = ["src/ugjcs"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ugjcs"]
